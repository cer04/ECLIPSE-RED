<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff2531"/>
    </marker>
    <filter id="g"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff2531" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1280" height="720" fill="#080404"/>

  <!-- corner brackets -->
  <g stroke="#ff2531" stroke-width="3" fill="none" opacity="0.8">
    <path d="M18,58 L18,18 L58,18"/><path d="M1262,58 L1262,18 L1222,18"/>
    <path d="M18,662 L18,702 L58,702"/><path d="M1262,662 L1262,702 L1222,702"/>
  </g>

  <text x="640" y="62" text-anchor="middle" fill="#ff2531" font-size="34" font-weight="800" letter-spacing="2" filter="url(#g)">ECLIPSE-RED — HOW IT WORKS</text>
  <text x="640" y="94" text-anchor="middle" fill="#d98f95" font-size="18">Simplest scenario: one target, the Reaper agent</text>

  <!-- ===== STEP 1: INPUT ===== -->
  <rect x="40" y="150" width="280" height="200" rx="14" fill="#140708" stroke="#ff2531" stroke-width="2.2"/>
  <circle cx="90" cy="196" r="20" fill="#2a0d0f" stroke="#ff2531" stroke-width="2"/>
  <text x="90" y="204" text-anchor="middle" fill="#ff2531" font-size="22" font-weight="800">1</text>
  <text x="126" y="203" fill="#f4f4f4" font-size="22" font-weight="800">INPUT</text>
  <text x="60" y="245" fill="#e9c9cc" font-size="16">You type one target</text>
  <text x="60" y="268" fill="#e9c9cc" font-size="16">into the dashboard.</text>
  <rect x="60" y="286" width="240" height="44" rx="8" fill="#0f0606" stroke="#ff5b64" stroke-width="1.6"/>
  <text x="180" y="314" text-anchor="middle" fill="#ff9aa0" font-size="20" font-family="Consolas,monospace" font-weight="700">172.20.0.11</text>

  <!-- ===== STEP 2: AGENT WORKS ===== -->
  <rect x="368" y="150" width="300" height="200" rx="14" fill="#140708" stroke="#ff2531" stroke-width="2.2" filter="url(#g)"/>
  <circle cx="418" cy="196" r="20" fill="#2a0d0f" stroke="#ff2531" stroke-width="2"/>
  <text x="418" y="204" text-anchor="middle" fill="#ff2531" font-size="22" font-weight="800">2</text>
  <text x="454" y="197" fill="#ff2531" font-size="22" font-weight="800">REAPER works</text>
  <text x="454" y="216" fill="#d98f95" font-size="14">(reconnaissance agent)</text>
  <text x="388" y="250" fill="#e9c9cc" font-size="15">🔓 Nmap — which ports are open?</text>
  <text x="388" y="276" fill="#e9c9cc" font-size="15">📄 Find hidden pages (/login, /api)</text>
  <text x="388" y="302" fill="#e9c9cc" font-size="15">🔎 Fingerprint the tech (Flask)</text>
  <text x="388" y="328" fill="#e9c9cc" font-size="15">🧠 AI summarises what matters</text>

  <!-- ===== STEP 3: OUTPUT ===== -->
  <rect x="716" y="150" width="300" height="200" rx="14" fill="#140708" stroke="#ff2531" stroke-width="2.2"/>
  <circle cx="766" cy="196" r="20" fill="#2a0d0f" stroke="#ff2531" stroke-width="2"/>
  <text x="766" y="204" text-anchor="middle" fill="#ff2531" font-size="22" font-weight="800">3</text>
  <text x="802" y="203" fill="#f4f4f4" font-size="22" font-weight="800">OUTPUT</text>
  <text x="736" y="243" fill="#e9c9cc" font-size="15">A structured record of</text>
  <text x="736" y="263" fill="#e9c9cc" font-size="15">everything it found:</text>
  <text x="736" y="292" fill="#ff9aa0" font-size="14" font-family="Consolas,monospace">recon_data = {</text>
  <text x="736" y="312" fill="#ff9aa0" font-size="14" font-family="Consolas,monospace">  hosts, open ports,</text>
  <text x="736" y="332" fill="#ff9aa0" font-size="14" font-family="Consolas,monospace">  paths, tech, AI notes }</text>

  <!-- ===== STEP 4: NEXT ===== -->
  <rect x="1044" y="150" width="196" height="200" rx="14" fill="#140708" stroke="#ff2531" stroke-width="2.2"/>
  <circle cx="1090" cy="196" r="20" fill="#2a0d0f" stroke="#ff2531" stroke-width="2"/>
  <text x="1090" y="204" text-anchor="middle" fill="#ff2531" font-size="22" font-weight="800">4</text>
  <text x="1126" y="203" fill="#f4f4f4" font-size="20" font-weight="800">NEXT</text>
  <text x="1064" y="245" fill="#ffd0d3" font-size="15" font-weight="700">⛔ You approve</text>
  <text x="1064" y="272" fill="#e9c9cc" font-size="15">→ Infiltrator</text>
  <text x="1064" y="294" fill="#e9c9cc" font-size="15">    attacks it</text>
  <text x="1064" y="316" fill="#e9c9cc" font-size="15">→ Ghost loots</text>
  <text x="1064" y="338" fill="#e9c9cc" font-size="15">→ Final report</text>

  <!-- arrows between steps -->
  <line x1="320" y1="250" x2="368" y2="250" stroke="#ff2531" stroke-width="3" marker-end="url(#a)"/>
  <line x1="668" y1="250" x2="716" y2="250" stroke="#ff2531" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1016" y1="250" x2="1044" y2="250" stroke="#ff2531" stroke-width="3" marker-end="url(#a)"/>

  <!-- one-line summary bar -->
  <rect x="40" y="420" width="1200" height="70" rx="12" fill="#0f0606" stroke="#ff2531" stroke-width="1.8"/>
  <text x="640" y="453" text-anchor="middle" fill="#f4f4f4" font-size="19" font-weight="700">In one sentence:</text>
  <text x="640" y="479" text-anchor="middle" fill="#ff9aa0" font-size="18">Give it a target  →  Reaper finds what's there  →  you approve  →  it attacks &amp; extracts data  →  you get a report.</text>

  <!-- safety footer -->
  <rect x="40" y="520" width="1200" height="120" rx="12" fill="#140708" stroke="#ff2531" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="66" y="552" fill="#ff2531" font-size="17" font-weight="800">🛡️  Built-in safety</text>
  <text x="66" y="582" fill="#e9c9cc" font-size="16">• Targets caged to the lab range only (Allowed CIDRs = 172.20.0.0/24)</text>
  <text x="66" y="608" fill="#e9c9cc" font-size="16">• Human-in-the-loop: no attack runs until the operator types “approve”</text>
  <text x="66" y="634" fill="#e9c9cc" font-size="16">• Isolated Docker network with no route to the internet</text>

  <text x="1240" y="695" text-anchor="end" fill="#ff2531" font-size="20" font-weight="800" letter-spacing="3" opacity="0.85">ECLIPSE-RED</text>
</svg>
